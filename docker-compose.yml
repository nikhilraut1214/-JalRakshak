version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: jalrakshak-db
    environment:
      POSTGRES_USER: jalrakshak
      POSTGRES_PASSWORD: jalrakshak_password
      POSTGRES_DB: jalrakshak_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jalrakshak -d jalrakshak_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: jalrakshak-backend
    environment:
      DATABASE_URL: postgresql://jalrakshak:jalrakshak_password@db:5432/jalrakshak_db
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-jalrakshak-dev-secret-key-change-in-prod-32chars}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jalrakshak-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
